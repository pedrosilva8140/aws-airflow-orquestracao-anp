# Airflow 3 com LocalExecutor + Postgres, para a EC2 m7i-flex.large (2 vCPU, 8 GB).
# Adaptado do docker-compose.yaml oficial do Airflow 3.4.0:
# - sem Celery, Redis, worker, flower e triggerer (o sensor usa mode="reschedule");
# - segredos obrigatórios no .env (sem senhas padrão);
# - interface só em 127.0.0.1 (acesso via port forwarding do SSM);
# - dags/ do repositório montado somente leitura.
# Uso (na pasta docker/): docker compose up -d --build

name: airflow-anp

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build: .
  image: airflow-anp:3.4.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "4"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg://airflow:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?defina AIRFLOW_FERNET_KEY no .env}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?defina AIRFLOW_JWT_SECRET no .env}
    AIRFLOW__API_AUTH__JWT_ISSUER: airflow-anp
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://api-server:8080/execution/
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Sao_Paulo
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # Configuração do DAG (lida pelas tarefas na execução).
    ANP_BUCKET: ${ANP_BUCKET:?defina ANP_BUCKET no .env}
    ANP_TOPICO_ALERTAS_ARN: ${ANP_TOPICO_ALERTAS_ARN:?defina ANP_TOPICO_ALERTAS_ARN no .env}
    ANP_GLUE_DATABASE: ${ANP_GLUE_DATABASE:?defina ANP_GLUE_DATABASE no .env}
    ANP_GLUE_TABELA: ${ANP_GLUE_TABELA:?defina ANP_GLUE_TABELA no .env}
    ANP_ATHENA_WORKGROUP: ${ANP_ATHENA_WORKGROUP:?defina ANP_ATHENA_WORKGROUP no .env}
    AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-2}
  volumes:
    - ../dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  logging: *logging
  restart: unless-stopped
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: airflow
    volumes:
      - postgres-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    logging: *logging
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    # Roda uma vez a cada subida: migra o banco e cria o admin (se não existir).
    entrypoint: /bin/bash
    command:
      - -c
      - |
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs
        /entrypoint airflow version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USUARIO:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_SENHA:?defina AIRFLOW_ADMIN_SENHA no .env}
    user: "0:0"
    restart: "no"

  api-server:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db:
  airflow-logs:
