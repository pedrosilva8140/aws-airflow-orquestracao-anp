name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  AIRFLOW_VERSION: "3.4.0"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # Sem Airflow, os testes de integridade falham em vez de serem pulados.
      EXIGIR_AIRFLOW: "1"
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow-ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependências (Airflow com as constraints oficiais)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt "apache-airflow==${AIRFLOW_VERSION}" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"

      - name: Lint
        run: ruff check .

      - name: Formatação
        run: ruff format --check .

      - name: Testes
        run: pytest -v

  compose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docker
    steps:
      - uses: actions/checkout@v5

      # O .env.example precisa bastar para o compose: prova que ele está completo.
      - name: Preparar .env de exemplo
        run: cp .env.example .env

      - name: Validar o compose
        run: docker compose config --quiet

      - name: Construir a imagem
        run: docker compose build
